[package]
name = "catshell"
version = "0.1.0"
description = "CatShell - 服务器远程运维工具 SSH/SFTP/监控"
authors = ["smcloudcat"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "catshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 版本策略（P2-18）：Tauri 生态（tauri / tauri-build / tauri-plugin-*）统一声明主版本 "2"，
# 与官方模板一致，补丁升级跟随生态；底层行为依赖（tokio / bytes / russh / russh-sftp）刻意
# 精确到小版本，避免解析到新版本时引入行为漂移。实际锁定由 Cargo.lock 兜底。
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"

# 类型自动生成（6.15）：为跨 IPC 的 DTO 派生 TS 绑定，cargo test 时导出到
# ../src/types/bindings/（对照源，见该目录 README）；不影响 ConnectRequest 等
# 「不实现 Serialize」的凭据安全约定——TS 派生只做类型映射，不引入 serde 序列化。
ts-rs = { version = "10", features = ["serde-compat", "no-serde-warnings"] }

# AI 辅助（6.17）：调用用户配置的 OpenAI 兼容接口做命令生成 / 日志诊断。
# reqwest 已在依赖树（updater 引入，rustls-tls），此处仅显式声明并加 json feature。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# AI apiKey 存系统凭据管理器（审计 S-2）：明文落盘 app-settings.json 是双标设计。
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# 凭据（密码 / 私钥口令 / OTP 密钥）在会话结束时用零化覆盖内存，缩短明文驻留窗口
zeroize = "1"
# 结构化日志：release 构建没有控制台，连接/传输失败必须落盘才能事后追查
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs"] }
bytes = "1.12.1"
# legacy-ed25519-pkcs8-parser 必须开在 russh 上：russh 0.63 自带密钥处理，
# 不依赖独立的 russh-keys crate，之前写在 russh-keys 上的同名 feature 实际不生效。
russh = { version = "0.63.2", default-features = false, features = ["flate2", "rsa", "ring", "legacy-ed25519-pkcs8-parser"] }
russh-sftp = "2.4.0"
# 密钥生成的随机源（russh::keys::ssh_key =0.7.0-rc.11 的 CryptoRng 需要 rand_core 0.10 系）
rand = "0.10"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
bytes = "1.12.1"
rand = "0.10.2"
