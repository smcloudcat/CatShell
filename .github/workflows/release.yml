name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    # 本 job 要用 `gh release create/upload` 写 Release，因此必须有 contents: write；
    # GITHUB_TOKEN 的作用域仅限本仓库，属于该流程的真实需求。
    # 真正敏感的是下面的 TAURI_SIGNING_PRIVATE_KEY——它只在需要签名的 step 注入，
    # 不再作为 job 级 env 暴露给 `npm ci` 等所有 step（审计 S-3）。
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify updater signing is configured
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY secret is not configured; refusing to build a release without updater signing.'
          }
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($conf.plugins.updater.pubkey -like 'REPLACE_WITH*') {
            throw 'tauri.conf.json still contains the placeholder updater pubkey; commit the real signing public key before tagging a release.'
          }
          # tag 与配置版本一致性校验：latest.json 的 version 取自 tauri.conf.json，
          # 错打 tag（如 v0.1.1 但配置仍是 0.1.0）会让 Release 名与更新端点版本互相矛盾。
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag name '$($env:GITHUB_REF_NAME)' is not vX.Y.Z; refusing to build a release from it."
          }
          if ($conf.version -ne $env:GITHUB_REF_NAME.Substring(1)) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match tauri.conf.json version $($conf.version); bump the version and re-tag."
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts 阻断依赖的 install/postinstall 生命周期脚本；锁文件里只有
      # macOS 专用的 fsevents 带安装脚本，Windows runner 不受影响（审计 S-3）。
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      # 唯一需要签名私钥的业务步骤：tauri CLI 从环境变量读取它来签名更新产物。
      - name: Build signed bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
      - name: Generate updater manifest (latest.json)
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Where-Object { $_.Name -notmatch '\.sig$' } |
            Select-Object -First 1
          if (-not $exe) { throw 'NSIS installer not found' }
          $sig = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          if (-not $sig) { throw 'Updater signature (.sig) not found; createUpdaterArtifacts must be enabled and signing configured' }
          $tag = $env:GITHUB_REF_NAME
          $assetUrl = "https://github.com/smcloudcat/CatShell/releases/download/$tag/$($exe.Name)"
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $manifest = [ordered]@{
            version = $version
            notes = "CatShell $version"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url = $assetUrl
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path latest.json -Encoding utf8
          Write-Output "::notice::latest.json generated for $version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CatShell-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CatShell-updater
          path: |
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi.sig
            latest.json
          if-no-files-found: error
      - name: Upload release assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "CatShell $tag"
          }

          # 安装包本体与签名必须挂到 Release：latest.json 里的下载地址指向
          # releases/download/<tag>/<installer>，只传 latest.json 会让更新请求 404。
          $assets = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
              Where-Object { $_.Name -notmatch '\.sig$' }
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig"
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi.sig"
          )
          if ($assets.Count -eq 0) { throw 'No installer assets found to upload to the release.' }

          gh release upload $tag @($assets.FullName) latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
          foreach ($asset in $assets) { Write-Output "::notice::uploaded $($asset.Name)" }

      - name: Verify updater endpoint resolves
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # 防止再次出现「manifest 指向不存在的资产」：上传后回读 Release 资产列表比对。
          $tag = $env:GITHUB_REF_NAME
          $manifest = Get-Content latest.json -Raw | ConvertFrom-Json
          $url = $manifest.platforms.'windows-x86_64'.url
          if ([string]::IsNullOrWhiteSpace($url)) { throw 'latest.json does not declare windows-x86_64.url' }

          $names = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Unable to read assets of release $tag" }
          if ($names.Count -eq 0) { throw "Release $tag has no assets attached." }

          $leaf = Split-Path $url -Leaf
          if ($names -notcontains $leaf) {
            throw "latest.json points at '$leaf', which is missing from release $tag. Attached: $($names -join ', ')"
          }
          if ($names -notcontains 'latest.json') {
            throw "Release $tag is missing the latest.json updater manifest."
          }
          Write-Output "::notice::Updater endpoint verified: $url"
