name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint / test / build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies (high and above)
        run: npm audit --audit-level=high
      - run: npm run lint
      - name: Check i18n coverage
        run: npm run i18n:check
      - name: Check for source mojibake
        run: npm run mojibake:check
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (fmt / clippy / check / test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo check
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  audit:
    name: Dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 只扫描 Cargo.lock，不编译，因此用 ubuntu 跑更快。
      # 该仓库没有浮动的 v2 标签，必须固定到具体版本。
      # 忽略项与 src-tauri/.cargo/audit.toml 保持一致（该文件含完整理由）。
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          ignore: RUSTSEC-2023-0071